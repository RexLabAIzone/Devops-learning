name: K8s Deploy

on:
  push:
    branches: [main]


jobs:
  deploy:
    runs-on: ubuntu-latest


  steps:
    - name: Checkout
      uses: actions/checkout@v5


    - name: Set image tag
      run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      run: |
        docker build -t rexleung/flask-demo:${IMAGE_TAG} .

    - name: Push image
      run: |
        docker push rexleung/flask-demo:${IMAGE_TAG}

    - name: Install kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Update deployment image
      run: |
        kubectl -n devops set image deployment/flask flask=rexleung/flask-demo:${IMAGE_TAG}

    - name: Wait rollout
      run: |
        kubectl -n devops rollout status deployment/flask
