apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deploy
  namespace: devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
       - name: flask
         image: flask-devops:1.0
         ports:
         - containerPort: 8000
         envFrom:
         - configMapRef:
             name: flask-config
         - secretRef:
             name: mysql-secret
