services:
  db:
    image: mysql:8.0
    container_name: compose-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devops}
      MYSQL_USER: ${MYSQL_USER:-devops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build: ./app
    container_name: compose-web
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-devops}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-devops}
    volumes:
      - ./app:/app
    depends_on:
      - db
    ports:
      - "5001:5000"

  nginx:
    image: nginx:latest
    container_name: compose-nginx
    restart: always
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8081:80"

volumes:
   mysql_data:
