name: Deploy


on:
  push:
    branches:
      - main


job:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_UESR }}
          key: ${{ secrects.SERVER_KEY }}
          script: |
            cd /home/ubuntu/app
            git pull
            docker compose up -d --build
