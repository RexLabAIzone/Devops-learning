version: "1.0.1"



services:
  app:
    build:
      context: ./app
    container_name: flask-app
    restart: always
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8082:80"
