version: "1.0.2"



services:
  app:
    build:
      context: ./app
    container_name: flask-prod
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nginx-prod
    restart: always
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8082:80"

  mysql:
    image: mysql:8.0
    container_name: mysql-prod
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
